name: Build Android APK

# Builds an installable arm64-v8a APK directly on a GitHub runner (no Expo EAS queue).
#
#   npm ci -> db:ensure -> expo prebuild -> gradlew assembleRelease -> kodeshRead-<sha>.apk
#
# Signing: with the four ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets set, the release is signed with
# that keystore (plugins/withAndroidReleaseSigning.js, same key every run = in-place upgrades on the
# phone). Without them the generated project signs with the debug keystore, so the APK still installs.
#
# publish_release=true also (re)creates the `app-latest` release with the APK attached. It is never
# marked "latest", so the app's `releases/latest/download/manifest.json` library URL is unaffected.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish / update the `app-latest` GitHub Release with the APK attached
        type: boolean
        default: false

permissions:
  contents: write # only used by the optional release step

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Ensure generated assets
        run: npm run db:ensure

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            f="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$f"
            {
              echo "KODESHREAD_KEYSTORE_FILE=$f"
              echo "KODESHREAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KODESHREAD_KEY_ALIAS=$KEY_ALIAS"
              echo "KODESHREAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_* secrets not set: building with the debug keystore (installable, but not upgradeable from a build signed with another key)."
          fi

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --clean

      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src"
          name="kodeshRead-$(git rev-parse --short HEAD).apk"
          mkdir -p dist-apk
          cp "$src" "dist-apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist-apk/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish app-latest release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          cp "dist-apk/$APK" dist-apk/kodeshRead-latest.apk
          if [ "$SIGNED" = "true" ]; then sign="signed with the release keystore"; else sign="signed with the debug keystore"; fi
          notes="Android APK (arm64-v8a) built from $GITHUB_SHA, $sign. Install: download \`kodeshRead-latest.apk\` on the phone and open it."
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest "dist-apk/$APK" dist-apk/kodeshRead-latest.apk \
            --target "$GITHUB_SHA" --title "kodeshRead app (latest build)" --notes "$notes" --latest=false

      - name: Summary
        run: |
          {
            echo "### APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- Signing: ${{ steps.keystore.outputs.signed == 'true' && 'release keystore (secrets)' || 'debug keystore (no secrets set)' }}"
            echo "- Download: the run's **Artifacts** section${{ inputs.publish_release && ', or the `app-latest` release' || '' }}"
          } >> "$GITHUB_STEP_SUMMARY"
