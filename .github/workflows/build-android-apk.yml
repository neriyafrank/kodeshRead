name: Build Android APK

# Builds an installable arm64-v8a APK directly on a GitHub runner (no Expo EAS queue).
#
#   npm ci -> db:ensure -> expo prebuild -> gradlew assembleRelease -> kodeshRead-<sha>.apk
#
# Signing: with the four ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets set, the release is signed with
# that keystore (plugins/withAndroidReleaseSigning.js, same key every run = in-place upgrades on the
# phone). Without them the generated project signs with the debug keystore, so the APK still installs.
#
# publish_release=true also (re)creates the `app-latest` release with the APK attached. It is never
# marked "latest", so the app's `releases/latest/download/manifest.json` library URL is unaffected.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish / update the `app-latest` GitHub Release with the APK attached
        type: boolean
        default: false

permissions:
  contents: write # only used by the optional release step

concurrency:
  group: build-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Ensure generated assets
        run: npm run db:ensure

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            f="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$f"
            {
              echo "KODESHREAD_KEYSTORE_FILE=$f"
              echo "KODESHREAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KODESHREAD_KEY_ALIAS=$KEY_ALIAS"
              echo "KODESHREAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_* secrets not set: building with the debug keystore (installable, but not upgradeable from a build signed with another key)."
          fi

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --clean

      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect signed APK
        id: apk
        run: |
          # Only the Gradle `release` output is accepted; an unsigned / unaligned file can never be picked up.
          dir="android/app/build/outputs/apk/release"
          ls -l "$dir"
          src="$dir/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::$src not found (found: $(ls "$dir"/*.apk 2>/dev/null | tr '\n' ' '))"
            exit 1
          fi
          name="kodeshRead-$(git rev-parse --short HEAD).apk"
          rm -rf dist-apk && mkdir -p dist-apk
          cp "$src" "dist-apk/$name"
          # The release asset is a byte-identical copy of the artifact file.
          cp "dist-apk/$name" dist-apk/kodeshRead-latest.apk
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l dist-apk

      - name: Verify APK (signature, alignment, size, SHA-256)
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "build-tools: $bt"
          for f in dist-apk/*.apk; do
            echo "::group::$f"
            echo "size: $(stat -c %s "$f") bytes"
            sha256sum "$f"
            case "$f" in *unsigned*) echo "::error::unsigned APK: $f"; exit 1;; esac
            "$bt/zipalign" -c -v 4 "$f" | tail -n 3
            "$bt/apksigner" verify --verbose --print-certs "$f" | tee "$RUNNER_TEMP/apksigner.txt"
            grep -Eq 'Verified using v(2|3)[^:]*: true' "$RUNNER_TEMP/apksigner.txt" \
              || { echo "::error::$f has no valid v2/v3 signature"; exit 1; }
            echo "::endgroup::"
          done
          test "$(sha256sum < dist-apk/${{ steps.apk.outputs.name }})" = "$(sha256sum < dist-apk/kodeshRead-latest.apk)"
          sha256sum dist-apk/*.apk > dist-apk/SHA256SUMS.txt
          cat dist-apk/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            dist-apk/${{ steps.apk.outputs.name }}
            dist-apk/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Publish app-latest release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          # Re-verify the exact files right before they are uploaded.
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for f in "dist-apk/$APK" dist-apk/kodeshRead-latest.apk; do
            "$bt/apksigner" verify --verbose "$f"
            echo "$f: $(stat -c %s "$f") bytes, sha256 $(sha256sum "$f" | cut -d' ' -f1)"
          done
          if [ "$SIGNED" = "true" ]; then sign="signed with the release keystore"; else sign="signed with the debug keystore"; fi
          notes="Android APK (arm64-v8a) built from $GITHUB_SHA, $sign. Install: download \`kodeshRead-latest.apk\` on the phone and open it."
          # Move the tag to this commit (create it if missing), then create / update the release in place.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/app-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/app-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/app-latest -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view app-latest >/dev/null 2>&1; then
            gh release edit app-latest --title "kodeshRead app (latest build)" --notes "$notes" --latest=false
            # Drop stale assets (e.g. APKs of older commits) so only this build remains.
            gh release view app-latest --json assets -q '.assets[].name' | while read -r n; do
              gh release delete-asset app-latest "$n" --yes
            done
          else
            gh release create app-latest --target "$GITHUB_SHA" --title "kodeshRead app (latest build)" --notes "$notes" --latest=false
          fi
          gh release upload app-latest "dist-apk/$APK" dist-apk/kodeshRead-latest.apk dist-apk/SHA256SUMS.txt --clobber
          # Download what was published and compare with the verified file.
          rm -rf release-check && mkdir release-check
          gh release download app-latest --pattern '*.apk' --dir release-check
          for f in release-check/*.apk; do
            "$bt/apksigner" verify --verbose "$f"
            test "$(sha256sum < "$f")" = "$(sha256sum < "dist-apk/$APK")" || { echo "::error::$f differs from the verified APK"; exit 1; }
          done
          echo "Release assets match the verified APK."

      - name: Summary
        run: |
          {
            echo "### APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- Signing: ${{ steps.keystore.outputs.signed == 'true' && 'release keystore (secrets)' || 'debug keystore (no secrets set)' }}"
            echo "- Download: the run's **Artifacts** section${{ inputs.publish_release && ', or the `app-latest` release' || '' }}"
          } >> "$GITHUB_STEP_SUMMARY"
